name: CI

# The test suite must never require Live. None of the runners below has a
# DAW, and that is the point: anything that can only be proven against running
# Live is proven in a catalog `status`, not in a test that would skip itself
# everywhere. See CONTRIBUTING.md.
#
# macOS is in the matrix because Live runs there and its on-disk layout differs:
# Library.cfg and Log.txt sit directly in the version folder rather than in a
# Preferences subfolder. Without a macOS runner that difference is invisible to
# CI, which is how it stayed broken while every check reported green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        # Everything a contributor is expected to keep clean, scripts/ included:
        # a linter that skips a directory reports green over code nobody checked.
        # live-remote-script/ is the one exclusion, because it runs inside Live's
        # own interpreter under different rules, and pyproject.toml excludes it too.
        run: ruff check src scripts tests
      - name: Types (pyright)
        # Paths, includes and the interpreter all come from [tool.pyright] in
        # pyproject.toml, so this runs the same check a contributor's editor does.
        run: pyright
      - name: Types (pyrefly)
        # Enforces strict typing rules including unnecessary-type-conversion configured
        # in [tool.pyrefly] in pyproject.toml.
        run: pyrefly check
      - name: Test (pytest)
        run: pytest -q

  # The gates above run against the working tree, where src/ and devices/ are
  # simply there. installer.py falls back to the checkout when the packaged
  # assets are missing, so a wheel that ships neither still reports green from
  # the repository. This job builds the artefact that actually gets published
  # and installs it somewhere else, which is the only place that fallback cannot
  # hide. Two releases had to be repaired by hand for want of it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: pipx run build
      - name: Install the wheel somewhere else
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install dist/*.whl
      - name: The wheel carries the files it promises
        working-directory: /tmp
        run: |
          /tmp/probe/bin/python - <<'PY'
          from live_maestro.installer import DEFAULT_SOURCE, DEVICE_SOURCE
          from live_maestro.registry import default_registry
          import live_maestro.server  # noqa: F401
          assert DEFAULT_SOURCE.is_file(), f"Remote Script missing: {DEFAULT_SOURCE}"
          assert DEVICE_SOURCE.is_file(), f"analyzer device missing: {DEVICE_SOURCE}"
          rows = default_registry().all()
          assert len(rows) > 1000, f"catalog did not ship: {len(rows)} rows"
          print(f"wheel is self contained: {len(rows)} catalog rows")
          PY
      - name: The sdist passes its own test suite
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          /tmp/probe/bin/pip install -e /tmp/sdist pytest
          cd /tmp/sdist && /tmp/probe/bin/pytest -q
